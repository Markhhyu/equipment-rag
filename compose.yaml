name: equipment-rag

# 两个应用服务共用的环境变量；`.env` 中的同名值会覆盖这里的安全本地默认值。
x-app-environment: &app-environment
  PROJECT_ROOT: /app
  # 应用环境和入口安全。
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  AUTH_MODE: ${AUTH_MODE:-disabled}
  AUTH_API_KEYS_JSON: ${AUTH_API_KEYS_JSON:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:8001}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.md}
  # OpenAI 兼容 LLM 和视觉模型。
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4.1-mini}
  VL_MODEL: ${VL_MODEL:-gpt-4.1-mini}
  LLM_DEFAULT_TEMPERATURE: ${LLM_DEFAULT_TEMPERATURE:-0.1}
  LLM_STREAM_USAGE: ${LLM_STREAM_USAGE:-true}
  # 图片资产化、异步视觉增强和查询阶段视觉推理；值来自根目录 .env。
  IMAGE_PROCESS_MODE: ${IMAGE_PROCESS_MODE:-smart}
  IMAGE_ASSET_COLLECTION: ${IMAGE_ASSET_COLLECTION:-document_image_assets}
  IMAGE_ENRICHMENT_ASYNC: ${IMAGE_ENRICHMENT_ASYNC:-true}
  IMAGE_ENRICHMENT_WORKERS: ${IMAGE_ENRICHMENT_WORKERS:-2}
  IMAGE_ENRICHMENT_POLL_SECONDS: ${IMAGE_ENRICHMENT_POLL_SECONDS:-3}
  IMAGE_ENRICHMENT_LEASE_SECONDS: ${IMAGE_ENRICHMENT_LEASE_SECONDS:-180}
  IMAGE_CAPTION_MAX_PER_DOCUMENT: ${IMAGE_CAPTION_MAX_PER_DOCUMENT:-30}
  IMAGE_CAPTION_TIMEOUT_SECONDS: ${IMAGE_CAPTION_TIMEOUT_SECONDS:-45}
  IMAGE_CAPTION_MAX_RETRIES: ${IMAGE_CAPTION_MAX_RETRIES:-1}
  IMAGE_CAPTION_REQUESTS_PER_MINUTE: ${IMAGE_CAPTION_REQUESTS_PER_MINUTE:-30}
  IMAGE_MIN_BYTES: ${IMAGE_MIN_BYTES:-8192}
  IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-20971520}
  IMAGE_STRONG_CAPTION_MIN_CHARS: ${IMAGE_STRONG_CAPTION_MIN_CHARS:-12}
  IMAGE_CONTEXT_CHARS: ${IMAGE_CONTEXT_CHARS:-240}
  QUERY_IMAGE_VISION_ENABLED: ${QUERY_IMAGE_VISION_ENABLED:-true}
  QUERY_IMAGE_TOP_K: ${QUERY_IMAGE_TOP_K:-3}
  QUERY_IMAGE_VISION_TIMEOUT_SECONDS: ${QUERY_IMAGE_VISION_TIMEOUT_SECONDS:-45}
  # 聊天附件只保存在当前租户/会话目录，不会写入Milvus或知识库图片资产集合。
  CHAT_ATTACHMENT_MAX_FILES: ${CHAT_ATTACHMENT_MAX_FILES:-3}
  CHAT_ATTACHMENT_MAX_BYTES: ${CHAT_ATTACHMENT_MAX_BYTES:-10485760}
  CHAT_ATTACHMENT_ALLOWED_EXTENSIONS: ${CHAT_ATTACHMENT_ALLOWED_EXTENSIONS:-.jpg,.jpeg,.png,.webp}
  CHAT_ATTACHMENT_ALLOWED_CONTENT_TYPES: ${CHAT_ATTACHMENT_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp}
  # Embedding 和 Reranker 模型。
  BGE_M3: ${BGE_M3:-BAAI/bge-m3}
  BGE_M3_PATH: ${BGE_M3_PATH:-}
  BGE_DEVICE: ${BGE_DEVICE:-cpu}
  BGE_FP16: ${BGE_FP16:-false}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-bge}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
  RERANKER_USE_FP16: ${RERANKER_USE_FP16:-false}
  RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
  RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
  RERANKER_NORMALIZE_SCORE: ${RERANKER_NORMALIZE_SCORE:-false}
  # RAG效果调优参数。每次Langfuse Trace都会保存这些参数，方便比较修改前后的效果。
  RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-2000}
  RAG_CHUNK_MIN_CHARS: ${RAG_CHUNK_MIN_CHARS:-500}
  RAG_RETRIEVAL_CANDIDATE_LIMIT: ${RAG_RETRIEVAL_CANDIDATE_LIMIT:-10}
  RAG_RETRIEVAL_RESULT_LIMIT: ${RAG_RETRIEVAL_RESULT_LIMIT:-5}
  RAG_DENSE_WEIGHT: ${RAG_DENSE_WEIGHT:-0.8}
  RAG_SPARSE_WEIGHT: ${RAG_SPARSE_WEIGHT:-0.2}
  RAG_RRF_K: ${RAG_RRF_K:-60}
  RAG_RRF_MAX_RESULTS: ${RAG_RRF_MAX_RESULTS:-10}
  RAG_RRF_EMBEDDING_WEIGHT: ${RAG_RRF_EMBEDDING_WEIGHT:-1.0}
  RAG_RRF_HYDE_WEIGHT: ${RAG_RRF_HYDE_WEIGHT:-1.0}
  RAG_RERANK_MAX_TOPK: ${RAG_RERANK_MAX_TOPK:-10}
  RAG_RERANK_MIN_TOPK: ${RAG_RERANK_MIN_TOPK:-1}
  RAG_RERANK_GAP_RATIO: ${RAG_RERANK_GAP_RATIO:-0.25}
  RAG_RERANK_GAP_ABS: ${RAG_RERANK_GAP_ABS:-0.5}
  # 没有明确型号代码时，商品名称向量匹配达到此分数且明显领先第二名才自动确认。
  RAG_ITEM_NAME_AUTO_CONFIRM_SCORE: ${RAG_ITEM_NAME_AUTO_CONFIRM_SCORE:-0.90}
  # Top1至少领先Top2多少才允许自动确认，可防止两个相近设备分数接近时误选第一名。
  RAG_ITEM_NAME_AUTO_CONFIRM_MARGIN: ${RAG_ITEM_NAME_AUTO_CONFIRM_MARGIN:-0.08}
  # 未达到自动确认条件但达到此分数时，只向用户展示候选并要求澄清。
  RAG_ITEM_NAME_CANDIDATE_SCORE: ${RAG_ITEM_NAME_CANDIDATE_SCORE:-0.78}
  # Milvus、MongoDB 和可恢复 Agent 运行。
  MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
  CHUNKS_COLLECTION: ${CHUNKS_COLLECTION:-equipment_chunks}
  ENTITY_NAME_COLLECTION: ${ENTITY_NAME_COLLECTION:-equipment_entities}
  ITEM_NAME_COLLECTION: ${ITEM_NAME_COLLECTION:-equipment_item_names}
  MONGO_URL: ${MONGO_URL:-mongodb://equipment:equipment-local@mongo:27017/equipment_rag?authSource=admin}
  MONGO_DB_NAME: ${MONGO_DB_NAME:-equipment_rag}
  RUN_STORE_BACKEND: ${RUN_STORE_BACKEND:-mongodb}
  RUN_STORE_COLLECTION: ${RUN_STORE_COLLECTION:-agent_runs}
  RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
  RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-900}
  LANGGRAPH_CHECKPOINT_BACKEND: ${LANGGRAPH_CHECKPOINT_BACKEND:-mongodb}
  LANGGRAPH_CHECKPOINT_DB: ${LANGGRAPH_CHECKPOINT_DB:-equipment_rag_checkpoints}
  LANGGRAPH_CHECKPOINT_TTL_SECONDS: ${LANGGRAPH_CHECKPOINT_TTL_SECONDS:-604800}
  # MinIO 内部连接、浏览器访问地址和私有对象签名。
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-equipment}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-equipment-local}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-equipment-rag}
  MINIO_IMG_DIR: ${MINIO_IMG_DIR:-images}
  MINIO_PDF_DIR: ${MINIO_PDF_DIR:-pdf_files}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  # 明确区域后，容器内可直接为localhost等浏览器公开地址生成签名URL，无需反向连接该地址。
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
  MINIO_PRESIGNED_URL_TTL_SECONDS: ${MINIO_PRESIGNED_URL_TTL_SECONDS:-3600}
  # 宿主机上独立运行的 MinerU PDF 解析服务。
  MINERU_API_BASE_URL: ${MINERU_API_BASE_URL:-http://host.docker.internal:8002}
  MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
  MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
  MINERU_EFFORT: ${MINERU_EFFORT:-high}
  MINERU_PARSE_METHOD: ${MINERU_PARSE_METHOD:-auto}
  MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch_server}
  MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-true}
  MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-true}
  MINERU_IMAGE_ANALYSIS: ${MINERU_IMAGE_ANALYSIS:-false}
  MINERU_RETURN_MIDDLE_JSON: ${MINERU_RETURN_MIDDLE_JSON:-true}
  MINERU_RETURN_CONTENT_LIST: ${MINERU_RETURN_CONTENT_LIST:-true}
  MINERU_POLL_INTERVAL_SECONDS: ${MINERU_POLL_INTERVAL_SECONDS:-3}
  MINERU_TASK_TIMEOUT_SECONDS: ${MINERU_TASK_TIMEOUT_SECONDS:-3600}
  MINERU_REQUEST_TIMEOUT_SECONDS: ${MINERU_REQUEST_TIMEOUT_SECONDS:-60}
  MINERU_DOWNLOAD_TIMEOUT_SECONDS: ${MINERU_DOWNLOAD_TIMEOUT_SECONDS:-600}
  MINERU_VERIFY_SSL: ${MINERU_VERIFY_SSL:-true}
  # 可选外部集成：百炼 MCP、Langfuse 和 Neo4j。
  MCP_DASHSCOPE_BASE_URL: ${MCP_DASHSCOPE_BASE_URL:-}
  MCP_DASHSCOPE_API_KEY: ${MCP_DASHSCOPE_API_KEY:-}
  MCP_DASHSCOPE_TRANSPORT: ${MCP_DASHSCOPE_TRANSPORT:-streamable_http}
  MCP_DASHSCOPE_TOOL_NAME: ${MCP_DASHSCOPE_TOOL_NAME:-bailian_web_search}
  LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
  # Trace仅保存图片数量、状态和定位摘要；禁止SDK扫描并上传Base64媒体，避免容器访问宿主机公开MinIO地址失败。
  LANGFUSE_MEDIA_UPLOAD_ENABLED: ${LANGFUSE_MEDIA_UPLOAD_ENABLED:-false}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  # Prometheus只记录数字和低基数标签，不记录问题、答案、文档正文和Trace ID。
  PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
  NEO4J_URI: ${NEO4J_URI:-}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
  # 控制台和文件日志。
  LOG_CONSOLE_ENABLE: ${LOG_CONSOLE_ENABLE:-true}
  LOG_CONSOLE_LEVEL: ${LOG_CONSOLE_LEVEL:-INFO}
  LOG_CONSOLE_ENCODING: ${LOG_CONSOLE_ENCODING:-utf-8}
  LOG_FILE_ENABLE: ${LOG_FILE_ENABLE:-true}
  LOG_FILE_LEVEL: ${LOG_FILE_LEVEL:-INFO}
  LOG_FILE_RETENTION: ${LOG_FILE_RETENTION:-7 days}
  LOG_ENQUEUE: ${LOG_ENQUEUE:-false}

# 应用服务公共模板：统一镜像、依赖服务、数据目录和重启策略。
x-app-service: &app-service
  build:
    context: .
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    mongo:
      condition: service_healthy
    minio:
      condition: service_healthy
    milvus:
      condition: service_healthy
  volumes:
    - model-cache:/root/.cache
    - app-output:/app/output
    - app-logs:/app/logs

services:
  # 文档导入 API：负责解析文件、生成向量并写入知识库。
  import-api:
    <<: *app-service
    command: ["uvicorn", "app.import_process.api.file_import_service:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${IMPORT_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # 查询 API：负责运行 RAG Agent 并提供聊天接口。
  query-api:
    <<: *app-service
    command: ["uvicorn", "app.query_process.api.query_service:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QUERY_API_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # MongoDB 保存会话历史、Agent 运行状态和 LangGraph 检查点。
  mongo:
    image: mongo:8.2.12-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-equipment}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-equipment-local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # etcd 保存 Milvus 的元数据。
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO 保存原始文档和文档中的图片。
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-equipment}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-equipment-local}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Milvus 保存文本向量和实体索引，提供语义检索能力。
  milvus:
    image: milvusdb/milvus:v2.6.18
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-equipment}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-equipment-local}
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MILVUS_PORT:-19530}:19530"
      - "${BIND_ADDRESS:-127.0.0.1}:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Prometheus负责定时抓取两个API服务的/metrics。
  # 使用profile避免默认启动增加资源占用：docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      import-api:
        condition: service_healthy
      query-api:
        condition: service_healthy

  # Grafana读取Prometheus并展示仓库自带的RAG仪表盘。
  # 本地默认密码仅用于开发，服务器部署前必须在.env中修改。
  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-equipment-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  # 命名卷让容器重建后仍能保留数据、模型缓存和日志。
  mongo-data:
  minio-data:
  etcd-data:
  milvus-data:
  model-cache:
  app-output:
  app-logs:
  prometheus-data:
  grafana-data:
