name: 应用图片配置

on:
  push:
    branches:
      - fix/image-observability-config
    paths:
      - .github/scripts/update_image_config.py
      - .github/workflows/apply-image-config.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-config:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新图片配置
        run: python .github/scripts/update_image_config.py

      - name: 校验配置变量
        run: |
          python - <<'PY'
          from pathlib import Path

          keys = [
              "IMAGE_PROCESS_MODE", "IMAGE_ASSET_COLLECTION", "IMAGE_ENRICHMENT_ASYNC",
              "IMAGE_ENRICHMENT_WORKERS", "IMAGE_ENRICHMENT_POLL_SECONDS", "IMAGE_ENRICHMENT_LEASE_SECONDS",
              "IMAGE_CAPTION_MAX_PER_DOCUMENT", "IMAGE_CAPTION_TIMEOUT_SECONDS", "IMAGE_CAPTION_MAX_RETRIES",
              "IMAGE_CAPTION_REQUESTS_PER_MINUTE", "IMAGE_MIN_BYTES", "IMAGE_MAX_BYTES",
              "IMAGE_STRONG_CAPTION_MIN_CHARS", "IMAGE_CONTEXT_CHARS", "QUERY_IMAGE_VISION_ENABLED",
              "QUERY_IMAGE_TOP_K", "QUERY_IMAGE_VISION_TIMEOUT_SECONDS",
          ]
          env = Path('.env.example').read_text(encoding='utf-8')
          compose = Path('compose.yaml').read_text(encoding='utf-8')
          for key in keys:
              assert env.count(f'{key}=') == 1, f'.env.example 中 {key} 数量不正确'
              assert compose.count(f'{key}:') == 1, f'compose.yaml 中 {key} 数量不正确'
          print(f'已校验 {len(keys)} 个图片处理变量')
          PY

      - name: 校验容器编排文件
        run: docker compose -f compose.yaml config --quiet

      - name: 提交正式配置并删除临时文件
        run: |
          rm -f .github/scripts/update_image_config.py
          rm -f .github/workflows/apply-image-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example compose.yaml .github/scripts/update_image_config.py .github/workflows/apply-image-config.yml
          git commit -m "补充图片视觉增强和多模态查询环境配置"
          git push origin HEAD:fix/image-observability-config
