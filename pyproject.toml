[project]
name = "equipment-rag"
version = "0.1.0"
description = "Enterprise-ready equipment knowledge RAG agent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141,<0.142",
    "flagembedding>=1.4,<2",
    "grandalf>=0.8,<1",
    "langchain>=1.3,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-openai>=1.4,<2",
    "langgraph>=1.2,<2",
    "langfuse>=4.14,<5",
    "loguru>=0.7.3,<0.8",
    "minio>=7.2.20,<8",
    "modelscope>=1.39,<2",
    "neo4j>=6.2,<7",
    "numpy>=2.5,<3",
    "openai-agents>=0.19,<1",
    "pymilvus[model]>=2.6.17,<2.7",
    "pymongo>=4.17,<5",
    "python-dotenv>=1.2.2,<2",
    "python-multipart>=0.0.32,<0.1",
    "regex>=2026.7.19",
    "requests>=2.34,<3",
    "sentence-transformers>=5.6,<6",
    "torch>=2.13,<2.14",
    "uvicorn[standard]>=0.52,<0.53",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-config --strict-markers --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=10"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "app/*/page/*",
    "app/tool/*",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["test", "deploy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",
    "F401",
    "F403",
    "F405",
    "F841",
]

[tool.ruff.format]
line-ending = "lf"
