upstream query_api {
    server query-api:8001;
}

upstream import_api {
    server import-api:8000;
}

upstream workflow_api {
    server workflow-api:8002;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /auth/ {
        proxy_pass http://query_api;
    }

    location = /query { proxy_pass http://query_api; }
    location = /feedback { proxy_pass http://query_api; }
    location = /resolution { proxy_pass http://query_api; }
    location ^~ /attachments/ { proxy_pass http://query_api; }
    location ^~ /history/ { proxy_pass http://query_api; }
    location ^~ /runs/ { proxy_pass http://query_api; }
    location ^~ /analytics/ { proxy_pass http://query_api; }
    location ^~ /stream/ {
        proxy_pass http://query_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /upload { proxy_pass http://import_api; }
    location ^~ /status/ { proxy_pass http://import_api; }
    location ^~ /knowledge/ { proxy_pass http://import_api; }

    location ^~ /workflow/ { proxy_pass http://workflow_api; }

    location = /apps.html { return 302 /apps; }
    location = /chat.html { return 302 /chat; }
    location = /analytics.html { return 302 /analytics; }
    location = /import.html { return 302 /import; }
    location = /knowledge.html { return 302 /knowledge; }
    location = /workflow.html { return 302 /workflow; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
